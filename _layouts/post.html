<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Sandmotion</title>
    <style>
        :root {
            --black: #050505;
            --accent: #c5a059; /* Gold accent */
            --white: #ffffff;
            --gray: #888888;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        nav {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #222;
        }

        .logo {
            color: var(--white);
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .post-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .post-title {
            font-size: 2.5rem;
            color: var(--white);
            margin-bottom: 10px;
        }

        .post-date {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .post-content {
            font-size: 1.1rem;
            color: #ccc;
        }

        .post-content h2 {
            color: var(--accent);
            margin-top: 40px;
        }

        .back-link {
            display: inline-block;
            margin-top: 60px;
            color: var(--gray);
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* Styling for the Demo Link */
        .post-content a {
            color: var(--accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<nav>
    <a href="/" class="logo">Sandmotion</a>
    <a href="/blog" style="color: var(--gray); text-decoration: none;">← BACK</a>
</nav>

<main class="container">
    <article class="blog-post">
        <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <p class="post-date">{{ page.date | date: "%B %d, %Y" }}</p>
        </header>

        <div class="post-content">
            {{ content }}
        </div>

        <a href="/blog" class="back-link">← Back to Insights</a>
    </article>
</main>

</body>
</html>
