---
layout: null
---
<!DOCTYPE html>
<html>
<head>
    <title>Insights & Perspective | Sandmotion</title>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; padding: 40px; text-align: center; }
        .blog-list { max-width: 700px; margin: 0 auto; list-style: none; padding: 0; text-align: left; }
        .blog-item { margin-bottom: 50px; border-bottom: 1px solid #222; padding-bottom: 30px; }
        .blog-date { color: #c5a059; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        .blog-title { display: block; font-size: 1.8rem; color: white; text-decoration: none; margin: 10px 0; font-weight: bold; }
        .blog-excerpt { color: #888; line-height: 1.5; font-size: 1rem; }
        .read-more { color: #c5a059; text-decoration: none; font-size: 0.9rem; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>
    <h1>Insights & Perspective</h1>
    <ul class="blog-list">
      {% for post in site.posts %}
        <li class="blog-item">
          <span class="blog-date">{{ post.date | date: "%B %d, %Y" }}</span>
          <a href="{{ post.url | relative_url }}" class="blog-title">{{ post.title }}</a>
          <p class="blog-excerpt">{{ post.content | strip_html | truncatewords: 25 }}</p>
          <a href="{{ post.url | relative_url }}" class="read-more">Read Entry →</a>
        </li>
      {% endfor %}
    </ul>
    <p><a href="/" style="color: gray; text-decoration: none;">← Back Home</a></p>
</body>
</html>
