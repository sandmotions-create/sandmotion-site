l="#A9A59A" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">visit → booking</text><text x="40" y="474" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#A9A59A" fill-opacity="1" text-anchor="start" font-weight="400" letter-spacing="0">Ranges from published Indian real estate benchmarks (OwlClaw, Sell.do). Your numbers will differ: measure them.</text></svg>