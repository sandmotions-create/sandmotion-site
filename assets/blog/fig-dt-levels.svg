<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="1" y="1" width="998" height="528" rx="20" fill="#11131A" stroke="#C9A96E" stroke-opacity=".28"/><text x="40" y="58" font-family="Georgia,'Cormorant Garamond',serif" font-size="30" fill="#F5F4F0" fill-opacity="1" text-anchor="start" font-weight="600" letter-spacing="0">Three levels of digital twin</text><rect x="50" y="240" width="270" height="200" rx="12" fill="#161922" stroke="#C9A96E" stroke-width="2"/><text x="70" y="284" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#DBBF82" fill-opacity="1" text-anchor="start" font-weight="700" letter-spacing="0">1 Visual twin</text><text x="70" y="322" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#A9A59A" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">Real-time 3D replica of an</text><text x="70" y="348" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#A9A59A" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">asset or plant</text><text x="70" y="416" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8FA7B8" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">Browser · tablet · AR/VR</text><rect x="350" y="190" width="270" height="250" rx="12" fill="#161922" stroke="#8FA7B8" stroke-width="2"/><text x="370" y="234" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#F5F4F0" fill-opacity="1" text-anchor="start" font-weight="700" letter-spacing="0">2 Data-linked twin</text><text x="370" y="272" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#A9A59A" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">Status and sensor data</text><text x="370" y="298" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#A9A59A" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">shown on the model</text><text x="370" y="416" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8FA7B8" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">Green · amber · red states</text><rect x="650" y="140" width="270" height="300" rx="12" fill="#161922" stroke="#8FA7B8" stroke-width="2"/><text x="670" y="184" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="22" fill="#F5F4F0" fill-opacity="1" text-anchor="start" font-weight="700" letter-spacing="0">3 Simulation twin</text><text x="670" y="222" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#A9A59A" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">Test scenarios and</text><text x="670" y="248" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#A9A59A" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">forecast behaviour</text><text x="670" y="416" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8FA7B8" fill-opacity="1" text-anchor="start" font-weight="500" letter-spacing="0">Airflow · stress · throughput</text><text x="50" y="486" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#DBBF82" fill-opacity="1" text-anchor="start" font-weight="600" letter-spacing="0">Start at level 1, prove value, then add data and simulation.</text></svg>